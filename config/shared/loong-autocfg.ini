; Jawaka's calibrated virtual Loong controller, appended to the upstream
; mupen64plus InputAutoCfg.ini at package time.
;
; With a wireless controller paired, the built-in pad is no longer SDL joystick
; 0, so the N64 controller sections run in full-auto mode and the input plugin
; maps each pad from this file by its SDL name. Without an entry here the
; built-in pad falls back to a generic guess and its face buttons land wrong.
;
; This mirrors the calibrated mapping shipped in config/shared/default.cfg
; [Input-SDL-Control1]; keep the two in step. The device Jawaka publishes is
; the uinput clone, whose stick reaches full range -- the deadzone and peak
; below are for that stream, not the raw hardware's partial throw.
;
; The C buttons are deliberately unbound: the MLP1 has a single analog stick
; and the shipped mapping leaves them free rather than stealing the d-pad.

[Loong Gamepad]
plugged = True
mouse = False
AnalogDeadzone = 4096,4096
AnalogPeak = 32767,32767
DPad R = hat(0 Right)
DPad L = hat(0 Left)
DPad D = hat(0 Down)
DPad U = hat(0 Up)
Start = button(9)
Z Trig = button(6)
B Button = button(0)
A Button = button(1)
C Button R =
C Button L =
C Button D =
C Button U =
R Trig = button(5)
L Trig = button(4)
Mempak switch =
Rumblepak switch =
X Axis = axis(0-,0+)
Y Axis = axis(1-,1+)
